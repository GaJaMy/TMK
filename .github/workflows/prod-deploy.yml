name: Production Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tmk:api

      - name: Build and push batch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: batch
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tmk:batch

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          source: "docker-compose.prod.yml,docker/caddy/Caddyfile,tmk-user-web/**,tmk-admin-web/**"
          target: ${{ secrets.PROD_DEPLOY_PATH }}
          strip_components: 0

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_USER }}
          key: ${{ secrets.VULTR_SSH_KEY }}
          script: |
            set -eu

            DEPLOY_PATH="${{ secrets.PROD_DEPLOY_PATH }}"
            cd "$DEPLOY_PATH"

            cat > .env.prod <<EOF
            POSTGRES_DB=${{ secrets.PROD_POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.PROD_POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.PROD_POSTGRES_PASSWORD }}
            POSTGRES_PORT=${{ secrets.PROD_POSTGRES_PORT }}
            REDIS_HOST=${{ secrets.PROD_REDIS_HOST }}
            REDIS_PORT=${{ secrets.PROD_REDIS_PORT }}
            ADMIN_JWT_SECRET=${{ secrets.PROD_ADMIN_JWT_SECRET }}
            USER_JWT_SECRET=${{ secrets.PROD_USER_JWT_SECRET }}
            OPENAI_API_KEY=${{ secrets.PROD_OPENAI_API_KEY }}
            OPENAI_EMBEDDING_MODEL=${{ secrets.PROD_OPENAI_EMBEDDING_MODEL }}
            OPENAI_CHAT_MODEL=${{ secrets.PROD_OPENAI_CHAT_MODEL }}
            OPENAI_CHAT_TEMPERATURE=${{ secrets.PROD_OPENAI_CHAT_TEMPERATURE }}
            OPENAI_CHAT_MAX_TOKENS=${{ secrets.PROD_OPENAI_CHAT_MAX_TOKENS }}
            DOCUMENT_STORAGE_DIR=${{ secrets.PROD_DOCUMENT_STORAGE_DIR }}
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            EOF

            docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" -p "${{ secrets.DOCKERHUB_TOKEN }}"
            docker compose --env-file .env.prod -f docker-compose.prod.yml stop tmk-api tmk-batch caddy || true
            docker compose --env-file .env.prod -f docker-compose.prod.yml rm -f tmk-api tmk-batch caddy || true
            docker compose --env-file .env.prod -f docker-compose.prod.yml pull tmk-api tmk-batch caddy
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --no-recreate
