services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: tmk-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tmk-prod-network

  redis:
    image: redis:7-alpine
    container_name: tmk-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-prod-data:/data
    networks:
      - tmk-prod-network

  tmk-api:
    image: ${DOCKERHUB_NAMESPACE}/tmk-api:${IMAGE_TAG}
    container_name: tmk-prod-api
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      USER_JWT_SECRET: ${USER_JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      DOCUMENT_STORAGE_DIR: ${DOCUMENT_STORAGE_DIR:-/app/uploads}
    volumes:
      - api-prod-uploads:${DOCUMENT_STORAGE_DIR:-/app/uploads}
    networks:
      - tmk-prod-network

  tmk-batch:
    image: ${DOCKERHUB_NAMESPACE}/tmk-batch:${IMAGE_TAG}
    container_name: tmk-prod-batch
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - tmk-prod-network

networks:
  tmk-prod-network:
    driver: bridge

volumes:
  postgres-prod-data:
  redis-prod-data:
  api-prod-uploads:
