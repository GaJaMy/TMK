<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMK History</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/styles.css">
</head>
<body class="user-home-body">
<main class="user-home-shell">
    <aside class="user-sidebar">
        <a class="user-sidebar-brand" href="./home.html">TMK</a>

        <nav class="user-sidebar-nav" aria-label="사용자 메뉴">
            <a class="user-nav-item" href="./documents.html">문서 등록</a>
            <a class="user-nav-item" href="./exams.html">시험 보기</a>
            <a class="user-nav-item is-active" href="./history.html">시험 내역확인</a>
        </nav>
    </aside>

    <section class="user-home-main">
        <header class="user-home-header">
            <div class="user-home-copy">
                <span class="hero-kicker">HISTORY</span>
                <h1>내가 진행한 시험 이력을 확인합니다.</h1>
                <p>시험 리스트에서 원하는 항목을 선택하면 별도 상세 화면에서 문제별 결과와 해설을 확인할 수 있습니다.</p>
            </div>

            <div class="user-account-box">
                <strong class="user-account-name" data-user-username>user</strong>
                <button type="button" class="user-logout-button" data-user-logout>로그아웃</button>
            </div>
        </header>

        <section class="history-list-section">
            <div class="history-section-head">
                <span class="feature-index">EXAM LIST</span>
                <h2>시험 이력 목록</h2>
            </div>

            <p class="document-list-status" id="historyListStatus">시험 이력을 불러오는 중입니다.</p>
            <div class="question-empty-state" id="historyListEmptyState" hidden>
                <strong>제출 완료된 시험이 없습니다.</strong>
                <p>시험을 제출하면 이 화면에서 결과 이력을 확인할 수 있습니다.</p>
            </div>
            <div class="history-linear-list" id="historyList"></div>
        </section>
    </section>
</main>
<script src="./assets/app.js"></script>
</body>
</html>
