server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: tmk-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: tmk-api
          app: tmk-api
          __path__: /workspace/logs/tmk-api.json.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            profile: profile
            logger: logger
            requestId: requestId
      - labels:
          level:
          service:
          profile:

  - job_name: tmk-batch
    static_configs:
      - targets:
          - localhost
        labels:
          job: tmk-batch
          app: tmk-batch
          __path__: /workspace/logs/tmk-batch.json.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            profile: profile
            logger: logger
            jobExecutionId: jobExecutionId
      - labels:
          level:
          service:
          profile:
