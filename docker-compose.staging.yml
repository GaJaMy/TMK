services:
  postgres-stg:
    image: pgvector/pgvector:pg17
    container_name: tmk-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-staging-data:/var/lib/postgresql/data
    networks:
      - tmk-staging-network

  redis-stg:
    image: redis:7-alpine
    container_name: tmk-staging-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-staging-data:/data
    networks:
      - tmk-staging-network

  tmk-api-stg:
    image: ${DOCKERHUB_USERNAME}/tmk-api:${API_IMAGE_TAG}
    container_name: tmk-staging-api
    restart: unless-stopped
    depends_on:
      - postgres-stg
      - redis-stg
    environment:
      SPRING_PROFILES_ACTIVE: staging
      DB_URL: jdbc:postgresql://postgres-stg:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      USER_JWT_SECRET: ${USER_JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL}
      OPENAI_CHAT_TEMPERATURE: ${OPENAI_CHAT_TEMPERATURE}
      OPENAI_CHAT_MAX_TOKENS: ${OPENAI_CHAT_MAX_TOKENS}
      DOCUMENT_STORAGE_DIR: ${DOCUMENT_STORAGE_DIR}
    volumes:
      - api-staging-uploads:${DOCUMENT_STORAGE_DIR}
    networks:
      - tmk-staging-network

  tmk-batch-stg:
    image: ${DOCKERHUB_USERNAME}/tmk-batch:${BATCH_IMAGE_TAG}
    container_name: tmk-staging-batch
    restart: unless-stopped
    depends_on:
      - postgres-stg
      - tmk-api-stg
    environment:
      SPRING_PROFILES_ACTIVE: staging
      DB_URL: jdbc:postgresql://postgres-stg:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - tmk-staging-network

networks:
  tmk-staging-network:
    driver: bridge

volumes:
  postgres-staging-data:
  redis-staging-data:
  api-staging-uploads:
