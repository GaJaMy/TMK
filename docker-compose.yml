services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: tmk-dev-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tmk}
      POSTGRES_USER: ${POSTGRES_USER:-tmk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tmk}
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - tmk-dev-network

  redis:
    image: redis:7-alpine
    container_name: tmk-dev-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-dev-data:/data
    networks:
      - tmk-dev-network

  loki:
    image: grafana/loki:3.2.1
    container_name: tmk-dev-loki
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki/config.yml:/etc/loki/config.yml:ro
      - loki-dev-data:/loki
    networks:
      - tmk-dev-network

  promtail:
    image: grafana/promtail:3.2.1
    container_name: tmk-dev-promtail
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./docker/promtail/config.yml:/etc/promtail/config.yml:ro
      - ./logs:/workspace/logs:ro
    depends_on:
      - loki
    networks:
      - tmk-dev-network

  grafana:
    image: grafana/grafana:11.2.2
    container_name: tmk-dev-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-dev-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
    networks:
      - tmk-dev-network

networks:
  tmk-dev-network:
    driver: bridge

volumes:
  postgres-dev-data:
  redis-dev-data:
  loki-dev-data:
  grafana-dev-data:
